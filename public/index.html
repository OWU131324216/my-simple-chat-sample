<!DOCTYPE html>
<html>
  <head>
    <title>Socket.IO chat</title>
    <style>
      body { margin: 0; padding-bottom: 3rem; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      #toolbar { display: flex; align-items: center; justify-content: flex-end; gap: 0.75rem; padding: 0.75rem 1rem 0; color: #555; }
      #change-name, #name-form button { border: 0; border-radius: 0.4rem; padding: 0.55rem 0.8rem; cursor: pointer; }
      #change-name { background: #eee; color: #333; }
      #form { background: rgba(0, 0, 0, 0.15); padding: 0.25rem; position: fixed; bottom: 0; left: 0; right: 0; display: flex; height: 3rem; box-sizing: border-box; backdrop-filter: blur(10px); }
      #input { border: none; padding: 0 1rem; flex-grow: 1; border-radius: 2rem; margin: 0.25rem; }
      #input:focus { outline: none; }
      #form > button { background: #333; border: none; padding: 0 1rem; margin: 0.25rem; border-radius: 3px; outline: none; color: #fff; }
      #messages { list-style-type: none; margin: 0; padding: 0; width: 100%; }
      .message-item {
        display: flex;
        align-items: flex-start;
        margin-bottom: 1rem;
        max-width: 70%;
      }
      .message-item.me {
        margin-left: auto;
        flex-direction: row-reverse;
      }
      .user-icon {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        margin: 0 10px;
        flex-shrink: 0;
      }
      .message-content {
        display: flex;
        flex-direction: column;
      }
      .message-item.me .message-content {
        align-items: flex-end;
      }
      .username {
        font-size: 0.8rem;
        color: #555;
      }
      .message-meta {
        display: flex;
        align-items: baseline;
        gap: 0.4rem;
        margin-bottom: 0.2rem;
      }
      .message-item.me .message-meta {
        flex-direction: row-reverse;
      }
      .timestamp {
        font-size: 0.7rem;
        color: #888;
      }
      .message-bubble {
        padding: 0.5rem 1rem;
        border-radius: 1rem;
        word-wrap: break-word;
      }
      .me .message-bubble {
        background: #dcf8c6;
      }
      .other .message-bubble {
        background: #efefef;
      }
      .system-message {
        text-align: center;
        color: #888;
        font-style: italic;
        margin: 0.5rem auto;
        font-size: 0.9rem;
      }
      #messages-container {
        padding: 1rem;
      }
      #name-overlay { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 1rem; background: rgba(0, 0, 0, 0.45); }
      #name-overlay.hidden, .hidden { display: none; }
      #name-dialog { box-sizing: border-box; width: min(100%, 24rem); padding: 1.5rem; border-radius: 0.8rem; background: white; box-shadow: 0 0.5rem 2rem rgba(0, 0, 0, 0.2); }
      #name-dialog h1 { margin: 0 0 0.5rem; font-size: 1.25rem; }
      #name-dialog p { color: #555; }
      #name-input { box-sizing: border-box; width: 100%; margin: 0.5rem 0 1rem; padding: 0.7rem; border: 1px solid #aaa; border-radius: 0.4rem; font: inherit; }
      #name-form button[type="submit"] { background: #333; color: white; }
      #name-form button[type="button"] { margin-left: 0.5rem; background: #eee; color: #333; }
      #name-error { margin: -0.5rem 0 0.75rem; color: #b00020 !important; }
      @media (max-width: 480px) { .message-item { max-width: 95%; } }
    </style>
  </head>
  <body>
    <header id="toolbar">
      <span>表示名: <strong id="current-name"></strong></span>
      <button id="change-name" type="button">表示名を変更</button>
    </header>
    <div id="messages-container">
      <ul id="messages"></ul>
    </div>
    <form id="form" action="">
      <input id="input" autocomplete="off" aria-label="メッセージ" maxlength="1000" /><button>送信</button>
    </form>
    <div id="name-overlay" role="dialog" aria-modal="true" aria-labelledby="name-title">
      <div id="name-dialog">
        <h1 id="name-title">表示名を設定</h1>
        <p>チャットで使う名前を入力してください（20文字以内）。</p>
        <form id="name-form">
          <label for="name-input">表示名</label>
          <input id="name-input" name="displayName" autocomplete="nickname" maxlength="20" required />
          <p id="name-error" class="hidden" role="alert">表示名を入力してください。</p>
          <button type="submit">決定</button>
          <button id="cancel-name" class="hidden" type="button">キャンセル</button>
        </form>
      </div>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script>
      const socket = io();

      let clientId = sessionStorage.getItem('clientId');
      if (!clientId) {
        clientId = Math.random().toString(36).substring(2, 15);
        sessionStorage.setItem('clientId', clientId);
      }
      let displayName = localStorage.getItem('displayName') || '';
      let registeredSocketId = null;
      let registeredDisplayName = null;

      const form = document.getElementById('form');
      const input = document.getElementById('input');
      const messages = document.getElementById('messages');
      const nameOverlay = document.getElementById('name-overlay');
      const nameForm = document.getElementById('name-form');
      const nameInput = document.getElementById('name-input');
      const nameError = document.getElementById('name-error');
      const cancelNameButton = document.getElementById('cancel-name');
      const currentName = document.getElementById('current-name');

      function registerUser() {
        if (!displayName || !socket.connected || (registeredSocketId === socket.id && registeredDisplayName === displayName)) return;
        registeredSocketId = socket.id;
        registeredDisplayName = displayName;
        socket.emit('user connected', { id: clientId, displayName });
      }

      function openNameDialog() {
        nameInput.value = displayName;
        nameError.classList.add('hidden');
        cancelNameButton.classList.toggle('hidden', !displayName);
        document.getElementById('name-title').textContent = displayName ? '表示名を変更' : '表示名を設定';
        nameOverlay.classList.remove('hidden');
        nameInput.focus();
      }

      function closeNameDialog() {
        nameOverlay.classList.add('hidden');
      }

      if (displayName.trim()) {
        displayName = displayName.trim().slice(0, 20);
        currentName.textContent = displayName;
        closeNameDialog();
        registerUser();
      } else {
        displayName = '';
        localStorage.removeItem('displayName');
        openNameDialog();
      }

      socket.on('connect', registerUser);

      nameForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const chosenName = nameInput.value.trim();
        if (!chosenName) {
          nameError.classList.remove('hidden');
          nameInput.focus();
          return;
        }
        displayName = chosenName.slice(0, 20);
        localStorage.setItem('displayName', displayName);
        currentName.textContent = displayName;
        nameError.classList.add('hidden');
        closeNameDialog();
        registerUser();
        input.focus();
      });

      document.getElementById('change-name').addEventListener('click', openNameDialog);
      cancelNameButton.addEventListener('click', closeNameDialog);

      function getColorFromId(id) {
        let hash = 0;
        for (let i = 0; i < id.length; i++) {
          hash = id.charCodeAt(i) + ((hash << 5) - hash);
        }
        const h = Math.abs(hash % 360);
        return `hsl(${h}, 60%, 65%)`;
      }

      function displaySystemMessage(message) {
        const item = document.createElement('li');
        item.className = 'system-message';
        item.textContent = message;
        messages.appendChild(item);
        window.scrollTo(0, document.body.scrollHeight);
      }

      function formatTimestamp(timestamp) {
        const date = timestamp ? new Date(timestamp) : new Date();
        return new Intl.DateTimeFormat('ja-JP', {
          hour: '2-digit',
          minute: '2-digit'
        }).format(date);
      }

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const message = input.value.trim();
        if (message && displayName) {
          const messageData = { msg: message };
          socket.emit('chat message', messageData);
          input.value = '';
        }
      });

      socket.on('welcome', (user) => {
        displaySystemMessage(`${user.displayName} さん、ようこそ`);
      });

      socket.on('user joined', (user) => {
        displaySystemMessage(`${user.displayName} さんが参加しました`);
      });

      socket.on('user left', (user) => {
        displaySystemMessage(`${user.displayName} さんが退出しました`);
      });

      socket.on('user renamed', (user) => {
        displaySystemMessage(`${user.oldDisplayName} さんが ${user.displayName} に名前を変更しました`);
      });

      socket.on('chat message', (data) => {
        const item = document.createElement('li');
        item.classList.add('message-item');

        const isMe = data.id === clientId;
        if (isMe) {
          item.classList.add('me');
        } else {
          item.classList.add('other');
        }

        const userIcon = document.createElement('img');
        userIcon.src = 'userIcon.png';
        userIcon.classList.add('user-icon');
        userIcon.style.backgroundColor = getColorFromId(data.id);

        const messageContent = document.createElement('div');
        messageContent.classList.add('message-content');

        const messageMeta = document.createElement('div');
        messageMeta.classList.add('message-meta');

        const username = document.createElement('div');
        username.classList.add('username');
        username.textContent = data.displayName || data.id.substring(0, 6);

        const timestamp = document.createElement('time');
        timestamp.classList.add('timestamp');
        timestamp.dateTime = new Date(data.timestamp || Date.now()).toISOString();
        timestamp.textContent = formatTimestamp(data.timestamp);

        const messageBubble = document.createElement('div');
        messageBubble.classList.add('message-bubble');
        messageBubble.textContent = data.msg;

        messageMeta.appendChild(username);
        messageMeta.appendChild(timestamp);

        messageContent.appendChild(messageMeta);
        messageContent.appendChild(messageBubble);

        item.appendChild(userIcon);
        item.appendChild(messageContent);

        messages.appendChild(item);
        window.scrollTo(0, document.body.scrollHeight);
      });
    </script>
  </body>
</html>
